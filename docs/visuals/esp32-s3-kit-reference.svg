<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">Ordered ESP32-S3 kit: conceptual layout</title><desc id="desc">AYWHP ESP32-S3 DevKitC-style WROOM-1-N16R8 board, ApTechDeals 840-point breadboard with jumper wires, Robocraze 0.96-inch 128 by 64 four-pin OLED advertised SPI/I2C. Lines show relationships, not wiring. Pins, controller and voltage require inspection after delivery. External LED and button may be needed.</desc><rect width="1000" height="460" fill="#f5f3ef"/><g font-family="sans-serif" fill="#202322"><text x="35" y="45" font-size="28">ESP32-S3 + breadboard + OLED</text><text x="35" y="78" font-size="16">Concept only · no pin assignments · hardware not yet inspected</text><rect x="35" y="115" width="930" height="220" rx="8" fill="white" stroke="#505954"/><path d="M55 135H945M55 315H945" stroke="#bbb"/><rect x="75" y="155" width="240" height="125" rx="4" fill="#f5f3ef" stroke="#505954"/><rect x="95" y="175" width="80" height="60" fill="white" stroke="#505954"/><text x="190" y="190" font-size="17">ESP32-S3</text><text x="190" y="215" font-size="13">N16R8</text><text x="100" y="262" font-size="14">USB-C · data cable required</text><path d="M315 205H580" stroke="#505954" stroke-dasharray="5 5"/><text x="358" y="185" font-size="13">Wiring to be confirmed</text><rect x="580" y="150" width="210" height="130" rx="4" fill="#f5f3ef" stroke="#505954"/><rect x="600" y="167" width="170" height="83" fill="#202322"/><text x="620" y="204" font-size="17" fill="white">OLED · 128×64</text><text x="620" y="229" font-size="12" fill="white">Controller unconfirmed</text><text x="600" y="269" font-size="12">Four pins · labels unconfirmed</text><text x="60" y="357" font-size="15">ApTechDeals 840-point breadboard + jumper wires</text><text x="35" y="395" font-size="16">Optional additions: external LED + resistor and button, if built-in parts are unsuitable.</text><text x="35" y="430" font-size="16">Simulate first. Inspect the kit. Confirm wiring. Then record physical test results.</text></g></svg>
