<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">ESP32-S3 to OLED wiring</title><desc id="desc">Four jumper wires. Board 3V3 to display VCC. Board GND to display GND. Board GPIO9 to display SCK. Board GPIO8 to display SDA. The Mac connects to the board's USB port, not COM. Connections are shown by printed label, not by physical pad position. This wiring passed on the owner's kit on 12 October 2026.</desc><rect width="1000" height="470" fill="#f5f3ef"/><g font-family="sans-serif" fill="#202322"><text x="35" y="45" font-size="28">ESP32-S3 to OLED: four wires</text><text x="35" y="76" font-size="16">Match the printed labels. Positions here are not the physical pad layout.</text><rect x="60" y="110" width="300" height="300" rx="8" fill="white" stroke="#505954" stroke-width="2"/><text x="80" y="145" font-size="20">YD-ESP32-23 v1.3</text><text x="80" y="170" font-size="14">ESP32-S3-N16R8</text><g font-size="18" font-family="monospace"><text x="240" y="216">3V3</text><text x="240" y="266">GND</text><text x="240" y="316">GPIO9</text><text x="240" y="366">GPIO8</text></g><g fill="#202322"><circle cx="350" cy="210" r="7"/><circle cx="350" cy="260" r="7"/><circle cx="350" cy="310" r="7"/><circle cx="350" cy="360" r="7"/></g><rect x="80" y="300" width="70" height="34" rx="4" fill="#f5f3ef" stroke="#505954"/><text x="92" y="323" font-size="15">USB</text><rect x="80" y="350" width="70" height="34" rx="4" fill="#f5f3ef" stroke="#bbb"/><text x="90" y="373" font-size="15" fill="#6b706d">COM</text><path d="M80 317H20" stroke="#505954" stroke-width="3"/><text x="20" y="300" font-size="13">to Mac</text><text x="158" y="372" font-size="12" fill="#6b706d">unused</text><g stroke-width="5" fill="none"><path d="M350 210H650" stroke="#c0392b"/><path d="M350 260H650" stroke="#202322"/><path d="M350 310H650" stroke="#2166ac"/><path d="M350 360H650" stroke="#1b7837"/></g><g font-size="14"><text x="420" y="200">3.3 V supply</text><text x="420" y="250">ground</text><text x="420" y="300">I²C clock</text><text x="420" y="350">I²C data</text></g><rect x="640" y="110" width="300" height="300" rx="8" fill="white" stroke="#505954" stroke-width="2"/><g fill="#202322"><circle cx="650" cy="210" r="7"/><circle cx="650" cy="260" r="7"/><circle cx="650" cy="310" r="7"/><circle cx="650" cy="360" r="7"/></g><g font-size="18" font-family="monospace"><text x="670" y="216">VCC</text><text x="670" y="266">GND</text><text x="670" y="316">SCK</text><text x="670" y="366">SDA</text></g><text x="760" y="145" font-size="20">1.3-inch OLED</text><text x="760" y="170" font-size="14">RG1.30 IIC V2.2</text><rect x="770" y="200" width="150" height="150" rx="4" fill="#202322"/><text x="785" y="270" font-size="15" fill="#7fe0d0">SH1106</text><text x="785" y="292" font-size="15" fill="#7fe0d0">at 0x3C</text><text x="60" y="445" font-size="15">Unplug USB before moving a wire. Restart the board after rewiring: it looks for the display at startup.</text></g></svg>
