<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Contribution workflow</title><desc id="desc">Choose issue: Use ready queue or discuss scope; Branch and change: Small focused commits; Check: Focused tests + integration if needed; Open PR: Explain behavior and evidence; Review and merge: Maintainer decides; credit all work. Software evidence does not establish physical or native Grok operation.</desc><rect width="100%" height="100%" fill="#f5f3ef"/><text x="32" y="46" font-family="sans-serif" font-size="28" fill="#202322">Contribution workflow</text><rect x="32" y="80" width="294" height="108" rx="4" fill="#fff" stroke="#505954"/><text x="48" y="107" font-family="monospace" font-size="13" fill="#3a4a40">01</text><text x="48" y="137" font-family="sans-serif" font-size="20" fill="#202322">Choose issue</text><text x="48" y="166" font-family="sans-serif" font-size="13" fill="#505954">Use ready queue or discuss scope</text><rect x="354" y="80" width="294" height="108" rx="4" fill="#fff" stroke="#505954"/><text x="370" y="107" font-family="monospace" font-size="13" fill="#3a4a40">02</text><text x="370" y="137" font-family="sans-serif" font-size="20" fill="#202322">Branch and change</text><text x="370" y="166" font-family="sans-serif" font-size="13" fill="#505954">Small focused commits</text><rect x="676" y="80" width="294" height="108" rx="4" fill="#fff" stroke="#505954"/><text x="692" y="107" font-family="monospace" font-size="13" fill="#3a4a40">03</text><text x="692" y="137" font-family="sans-serif" font-size="20" fill="#202322">Check</text><text x="692" y="166" font-family="sans-serif" font-size="13" fill="#505954">Focused tests + integration if needed</text><rect x="32" y="225" width="294" height="108" rx="4" fill="#fff" stroke="#505954"/><text x="48" y="252" font-family="monospace" font-size="13" fill="#3a4a40">04</text><text x="48" y="282" font-family="sans-serif" font-size="20" fill="#202322">Open PR</text><text x="48" y="311" font-family="sans-serif" font-size="13" fill="#505954">Explain behavior and evidence</text><rect x="354" y="225" width="294" height="108" rx="4" fill="#fff" stroke="#505954"/><text x="370" y="252" font-family="monospace" font-size="13" fill="#3a4a40">05</text><text x="370" y="282" font-family="sans-serif" font-size="20" fill="#202322">Review and merge</text><text x="370" y="311" font-family="sans-serif" font-size="13" fill="#505954">Maintainer decides; credit all work</text></svg>
