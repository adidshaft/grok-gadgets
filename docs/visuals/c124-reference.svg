<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">AtomS3 Lite C124 functional reference</title><desc id="desc">Conceptual functional reference, not a wiring drawing or photograph. ESP32-S3, one RGB LED data GPIO35, active low user button GPIO41, USB-C data transport. Firmware compiled, no physical verification.</desc><rect width="1000" height="460" fill="#f5f3ef"/><g font-family="sans-serif" fill="#202322"><text x="35" y="50" font-size="28">AtomS3 Lite · C124</text><text x="35" y="85" font-size="16">Functional reference · schematic placement, not dimensions</text><rect x="65" y="125" width="265" height="260" rx="18" fill="white" stroke="#505954" stroke-width="2"/><circle cx="198" cy="205" r="37" fill="#dce5dc" stroke="#505954"/><text x="148" y="269" font-size="18">User button</text><rect x="155" y="325" width="85" height="28" rx="4" fill="#202322"/><path d="M240 340H435M237 205H435" fill="none" stroke="#505954" stroke-width="2"/><text x="460" y="155" font-size="20">ESP32-S3FN8 · 8 MB flash</text><text x="460" y="212" font-size="20">RGB LED · data GPIO35</text><text x="460" y="250" font-size="20">User button · GPIO41 · active low</text><text x="460" y="346" font-size="20">USB-C data cable · serial transport</text><text x="35" y="432" font-size="17">Manufacturer pin evidence · firmware compilation passed · physical LED/button pending</text></g></svg>
