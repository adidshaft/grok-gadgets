<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Command evidence</title><desc id="desc">Requested: A command ID and arguments; Accepted: Gateway validates and routes; Execution reported: Simulator or firmware reports; Physically observed: Separate human observation. Software evidence does not establish physical or native Grok operation.</desc><rect width="100%" height="100%" fill="#f5f3ef"/><text x="32" y="46" font-family="sans-serif" font-size="28" fill="#202322">Command evidence</text><rect x="32" y="80" width="294" height="108" rx="4" fill="#fff" stroke="#505954"/><text x="48" y="107" font-family="monospace" font-size="13" fill="#3a4a40">01</text><text x="48" y="137" font-family="sans-serif" font-size="20" fill="#202322">Requested</text><text x="48" y="166" font-family="sans-serif" font-size="13" fill="#505954">A command ID and arguments</text><rect x="354" y="80" width="294" height="108" rx="4" fill="#fff" stroke="#505954"/><text x="370" y="107" font-family="monospace" font-size="13" fill="#3a4a40">02</text><text x="370" y="137" font-family="sans-serif" font-size="20" fill="#202322">Accepted</text><text x="370" y="166" font-family="sans-serif" font-size="13" fill="#505954">Gateway validates and routes</text><rect x="676" y="80" width="294" height="108" rx="4" fill="#fff" stroke="#505954"/><text x="692" y="107" font-family="monospace" font-size="13" fill="#3a4a40">03</text><text x="692" y="137" font-family="sans-serif" font-size="20" fill="#202322">Execution reported</text><text x="692" y="166" font-family="sans-serif" font-size="13" fill="#505954">Simulator or firmware reports</text><rect x="32" y="225" width="294" height="108" rx="4" fill="#fff" stroke="#505954"/><text x="48" y="252" font-family="monospace" font-size="13" fill="#3a4a40">04</text><text x="48" y="282" font-family="sans-serif" font-size="20" fill="#202322">Physically observed</text><text x="48" y="311" font-family="sans-serif" font-size="13" fill="#505954">Separate human observation</text></svg>
