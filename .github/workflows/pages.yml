name: Deploy website to Cloudflare Pages
on:
  workflow_run:
    workflows: [Integrated acceptance]
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
# One production group for every revision: deployments never overlap, and a newer
# queued run replaces an older queued one. A started run is never cancelled mid-upload.
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: grok-gadgets
          persist-credentials: false
      - name: Verify required checks passed for this exact main commit
        working-directory: grok-gadgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for attempt in $(seq 1 20); do
            gh run list --repo "$GITHUB_REPOSITORY" --commit "$DEPLOY_SHA" --limit 100 --json name,status,conclusion,headSha > "$RUNNER_TEMP/runs.json"
            result=$(jq -r --arg sha "$DEPLOY_SHA" '
              def state($name):
                ([.[] | select(.headSha == $sha and .name == $name)] | first) as $run
                | if $run == null or $run.status != "completed" then "pending"
                  elif $run.conclusion == "success" then "success"
                  else "failure"
                  end;
              [state("Hub checks"), state("Integrated acceptance")] | join(",")
            ' "$RUNNER_TEMP/runs.json")
            if [ "$result" = "success,success" ]; then
              echo "Both required workflows succeeded for $DEPLOY_SHA."
              exit 0
            fi
            case "$result" in
              *failure*) echo "A required workflow did not succeed for $DEPLOY_SHA." >&2; exit 1 ;;
            esac
            if [ "$attempt" -lt 20 ]; then sleep 30; fi
          done
          echo "Required checks did not finish for $DEPLOY_SHA; no deployment was made." >&2
          exit 1
      - name: Check out gateway main for the simulator kit and its docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-gateway
          ref: main
          path: grok-gadgets-gateway
          # Full history: imported gateway docs are checked at their recorded commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out grok-gadgets-linux-sdk main for its docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-linux-sdk
          ref: main
          path: grok-gadgets-linux-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Check out grok-gadgets-esp32-sdk main for its docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-esp32-sdk
          ref: main
          path: grok-gadgets-esp32-sdk
          fetch-depth: 0
          persist-credentials: false
      - name: Check out grok-gadgets-home-assistant main for its docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-home-assistant
          ref: main
          path: grok-gadgets-home-assistant
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'
      - name: Import component docs from every component main
        working-directory: grok-gadgets
        # The site shows each component's current main README and guides (D2).
        run: python scripts/import-component-docs.py
      - name: Build the simulator kit from gateway main when its inputs changed
        working-directory: grok-gadgets
        # Rebuilding runs the gateway tests and the installed-kit MCP acceptance first.
        run: python scripts/build-simulator-kit.py --ensure
      - name: Install the website build requirements
        working-directory: grok-gadgets
        run: python -m pip install --requirement website/requirements.txt
      - name: Refresh the complete five-repository issue snapshot
        working-directory: grok-gadgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh-github-snapshot.py
      - name: Refresh bounded public activity snapshot
        working-directory: grok-gadgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python website/activity.py --live --owner adidshaft --cache publication/github-activity.json
      - name: Validate snapshots and rebuild the site for its Cloudflare URL
        working-directory: grok-gadgets
        env:
          GROK_GADGETS_PUBLIC_SITE: https://grokgadgets.org/
        run: |
          python scripts/refresh-github-snapshot.py --check
          python -m unittest discover -s website -p 'test_*.py'
          node --test website/test_simulator.cjs
          python website/build.py
          python scripts/check-social-preview.py website/dist
          python scripts/check-pages-prefix.py
          python scripts/build-simulator-kit.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-site-${{ github.run_id }}
          path: grok-gadgets/website/dist
          # Only public build output is uploaded, including .well-known/security.txt.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/deploy
      - name: Skip this revision if main has moved on
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: .github/deploy/check-current-main.sh "$GITHUB_REPOSITORY" "$DEPLOY_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.current == 'true'
        with:
          node-version: '22'
      - name: Install the locked deploy tool
        if: steps.current.outputs.current == 'true'
        # Every package is integrity-pinned by package-lock.json; no install scripts run.
        run: npm ci --prefix .github/deploy --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.current == 'true'
        with:
          name: cloudflare-site-${{ github.run_id }}
          path: website/dist
      - name: Verify the downloaded security contact file
        if: steps.current.outputs.current == 'true'
        run: test -s website/dist/.well-known/security.txt
      - name: Recheck current main immediately before upload
        if: steps.current.outputs.current == 'true'
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: .github/deploy/check-current-main.sh "$GITHUB_REPOSITORY" "$DEPLOY_SHA"
      - name: Deploy the tested site to Cloudflare Pages
        if: steps.recheck.outputs.current == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/deploy/node_modules/.bin/wrangler pages deploy website/dist --project-name=grok-gadgets --branch=main
