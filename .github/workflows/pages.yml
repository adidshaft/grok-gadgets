name: Deploy website to Cloudflare Pages
on:
  workflow_run:
    workflows: [Integrated acceptance]
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: grok-gadgets
          persist-credentials: false
      - name: Verify required checks passed for this exact main commit
        working-directory: grok-gadgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for attempt in $(seq 1 20); do
            gh run list --repo "$GITHUB_REPOSITORY" --commit "$DEPLOY_SHA" --limit 100 --json name,status,conclusion,headSha > "$RUNNER_TEMP/runs.json"
            result=$(jq -r --arg sha "$DEPLOY_SHA" '
              def state($name):
                ([.[] | select(.headSha == $sha and .name == $name)] | first) as $run
                | if $run == null or $run.status != "completed" then "pending"
                  elif $run.conclusion == "success" then "success"
                  else "failure"
                  end;
              [state("Hub checks"), state("Integrated acceptance")] | join(",")
            ' "$RUNNER_TEMP/runs.json")
            if [ "$result" = "success,success" ]; then
              echo "Both required workflows succeeded for $DEPLOY_SHA."
              exit 0
            fi
            case "$result" in
              *failure*) echo "A required workflow did not succeed for $DEPLOY_SHA." >&2; exit 1 ;;
            esac
            if [ "$attempt" -lt 20 ]; then sleep 30; fi
          done
          echo "Required checks did not finish for $DEPLOY_SHA; no deployment was made." >&2
          exit 1
      - name: Check out gateway main for the simulator kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-gateway
          ref: main
          path: grok-gadgets-gateway
          # Full history: imported gateway docs are checked at their recorded commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
      - name: Build the simulator kit from gateway main when its inputs changed
        working-directory: grok-gadgets
        # Rebuilding runs the gateway tests and the installed-kit MCP acceptance first.
        run: python scripts/build-simulator-kit.py --ensure
      - name: Install the website build requirements
        working-directory: grok-gadgets
        run: python -m pip install --requirement website/requirements.txt
      - name: Refresh the complete five-repository issue snapshot
        working-directory: grok-gadgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh-github-snapshot.py
      - name: Refresh bounded public activity snapshot
        working-directory: grok-gadgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python website/activity.py --live --owner adidshaft --cache publication/github-activity.json
      - name: Validate snapshots and rebuild the site for its Cloudflare URL
        working-directory: grok-gadgets
        env:
          GROK_GADGETS_PUBLIC_SITE: https://grok-gadgets.pages.dev/
        run: |
          python scripts/refresh-github-snapshot.py --check
          python -m unittest discover -s website -p 'test_*.py'
          node --test website/test_simulator.cjs
          python website/build.py
          python scripts/check-social-preview.py website/dist
          python scripts/check-pages-prefix.py
          python scripts/build-simulator-kit.py --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-site-${{ github.run_id }}
          path: grok-gadgets/website/dist
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/deploy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install the locked deploy tool
        # Every package is integrity-pinned by package-lock.json; no install scripts run.
        run: npm ci --prefix .github/deploy --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloudflare-site-${{ github.run_id }}
          path: website/dist
      - name: Deploy the tested site to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/deploy/node_modules/.bin/wrangler pages deploy website/dist --project-name=grok-gadgets --branch=main
