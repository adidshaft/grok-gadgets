name: Integrated acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_repository:
        description: 'Optional component repository; pair with exact SHA. No automatic pin promotion.'
        type: choice
        default: ''
        options: ['', grok-gadgets-gateway, grok-gadgets-linux-sdk, grok-gadgets-esp32-sdk, grok-gadgets-home-assistant]
      candidate_commit:
        description: 'Optional full lowercase SHA in the selected component repository'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}-${{ inputs.candidate_repository || 'pins' }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grok-gadgets
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
      - name: Resolve exact component sources
        id: pins
        working-directory: grok-gadgets
        env:
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository || '' }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit || '' }}
        run: python scripts/ci-component-pins.py --candidate-repository "$CANDIDATE_REPOSITORY" --candidate-commit "$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-gateway
          ref: ${{ steps.pins.outputs.gateway }}
          path: grok-gadgets-gateway
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-linux-sdk
          ref: ${{ steps.pins.outputs.linux }}
          path: grok-gadgets-linux-sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-esp32-sdk
          ref: ${{ steps.pins.outputs.esp32 }}
          path: grok-gadgets-esp32-sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-home-assistant
          ref: ${{ steps.pins.outputs.ha }}
          path: grok-gadgets-home-assistant
          persist-credentials: false
      - name: Install pinned check environments
        shell: bash
        run: |
          uv venv grok-gadgets/.venv --python 3.13
          uv pip install --python grok-gadgets/.venv/bin/python -r grok-gadgets/website/requirements.txt
          for component in grok-gadgets-gateway grok-gadgets-linux-sdk grok-gadgets-home-assistant; do
            (cd "$component" && uv sync --locked --python 3.11 && uv build)
          done
          # Locked sync alone does not populate pip resolver metadata for offline acceptance.
          uv export --project grok-gadgets-gateway --frozen --offline --no-dev --no-emit-project --no-header --no-annotate --output-file "$RUNNER_TEMP/grok-onboarding-runtime.txt"
          uv venv "$RUNNER_TEMP/grok-onboarding-cache" --python 3.11
          uv pip install --python "$RUNNER_TEMP/grok-onboarding-cache/bin/python" --require-hashes -r "$RUNNER_TEMP/grok-onboarding-runtime.txt"
          python -m venv grok-gadgets-esp32-sdk/.venv
          grok-gadgets-esp32-sdk/.venv/bin/pip install -r grok-gadgets-esp32-sdk/requirements.lock
          (cd grok-gadgets-esp32-sdk && .venv/bin/pio pkg install)
      - name: Refresh and test candidate kit
        working-directory: grok-gadgets
        run: .venv/bin/python website/build.py
      - name: All fourteen integration groups
        working-directory: grok-gadgets
        run: .venv/bin/python scripts/check-all.py
      - name: Migration, publication and deployment-path regressions
        working-directory: grok-gadgets
        run: |
          .venv/bin/python -m unittest discover -s scripts -p 'test_*.py'
          .venv/bin/python scripts/build-simulator-kit.py --check
          .venv/bin/python scripts/check-pages-prefix.py
      - name: Save redacted software evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-evidence-${{ github.run_id }}
          path: grok-gadgets/artifacts/verification/
          retention-days: 7
