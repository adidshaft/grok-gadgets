name: Integrated acceptance
# Nightly and dev events integrate dev; main events integrate the release branches.
# The exact pins in compatibility/tested-components.json are a release record only.
on:
  push:
  pull_request:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      components:
        description: 'main or dev: current component branch heads; pinned: recorded release pins'
        type: choice
        default: main
        options: [main, dev, pinned]
      candidate_repository:
        description: 'Optional component repository; pair with exact SHA. No automatic pin promotion.'
        type: choice
        default: ''
        options: ['', grok-gadgets-gateway, grok-gadgets-linux-sdk, grok-gadgets-esp32-sdk, grok-gadgets-home-assistant]
      candidate_commit:
        description: 'Optional full lowercase SHA in the selected component repository'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}-${{ inputs.candidate_repository || 'pins' }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grok-gadgets
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.3'
      - name: Resolve exact component sources
        id: pins
        working-directory: grok-gadgets
        env:
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository || '' }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit || '' }}
          COMPONENTS: ${{ inputs.components || ((github.event_name == 'schedule' || github.base_ref == 'dev' || github.ref == 'refs/heads/dev') && 'dev' || 'main') }}
        run: |
          python scripts/ci-component-pins.py --source "$COMPONENTS" --candidate-repository "$CANDIDATE_REPOSITORY" --candidate-commit "$CANDIDATE_COMMIT" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-gateway
          ref: ${{ steps.pins.outputs.gateway }}
          fetch-depth: 0
          path: grok-gadgets-gateway
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-linux-sdk
          ref: ${{ steps.pins.outputs.linux }}
          fetch-depth: 0
          path: grok-gadgets-linux-sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-esp32-sdk
          ref: ${{ steps.pins.outputs.esp32 }}
          fetch-depth: 0
          path: grok-gadgets-esp32-sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-home-assistant
          ref: ${{ steps.pins.outputs.ha }}
          fetch-depth: 0
          path: grok-gadgets-home-assistant
          persist-credentials: false
      - name: Install pinned check environments
        shell: bash
        run: |
          uv venv grok-gadgets/.venv --python 3.13
          uv pip install --python grok-gadgets/.venv/bin/python -r grok-gadgets/website/requirements.txt ruff==0.14.14
          for component in grok-gadgets-gateway grok-gadgets-linux-sdk grok-gadgets-home-assistant; do
            (cd "$component" && uv sync --locked --python 3.11 && uv build)
          done
          # Locked sync alone does not populate pip resolver metadata for offline acceptance.
          uv export --project grok-gadgets-gateway --frozen --offline --no-dev --no-emit-project --no-header --no-annotate --output-file "$RUNNER_TEMP/grok-onboarding-runtime.txt"
          uv venv "$RUNNER_TEMP/grok-onboarding-cache" --python 3.11
          uv pip install --python "$RUNNER_TEMP/grok-onboarding-cache/bin/python" --require-hashes -r "$RUNNER_TEMP/grok-onboarding-runtime.txt"
          python -m venv grok-gadgets-esp32-sdk/.venv
          grok-gadgets-esp32-sdk/.venv/bin/pip install -r grok-gadgets-esp32-sdk/requirements.lock
          (cd grok-gadgets-esp32-sdk && .venv/bin/pio pkg install)
      - name: Prepare an explicitly selected candidate in this disposable checkout
        if: inputs.candidate_repository != ''
        working-directory: grok-gadgets
        env:
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = Path("compatibility/tested-components.json")
          data = json.loads(manifest.read_text())
          for component in data["components"]:
              if component["repository"] == os.environ["CANDIDATE_REPOSITORY"]:
                  component["commit"] = os.environ["CANDIDATE_COMMIT"]
          manifest.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Rebuild the kit in this disposable checkout if gateway inputs changed
        working-directory: grok-gadgets
        run: .venv/bin/python scripts/build-simulator-kit.py --ensure
      - name: Verify committed or explicitly rebuilt simulator kit
        working-directory: grok-gadgets
        run: .venv/bin/python website/build.py
      - name: All fourteen integration groups
        working-directory: grok-gadgets
        run: .venv/bin/python scripts/check-all.py
      - name: Migration, publication and deployment-path regressions
        working-directory: grok-gadgets
        run: |
          .venv/bin/python -m unittest discover -s scripts -p 'test_*.py'
          .venv/bin/python scripts/build-simulator-kit.py --check
          .venv/bin/python scripts/check-pages-prefix.py
      - name: Save redacted software evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-evidence-${{ github.run_id }}
          path: grok-gadgets/artifacts/verification/
          retention-days: 7
