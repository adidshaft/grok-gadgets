name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check.py
      - run: python -m unittest discover -s community/tests
      - run: python -m unittest discover -s website -p 'test_*.py'
      - run: python website/build.py
