name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r website/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test website/test_simulator.cjs
      - run: python scripts/build-simulator-kit.py --check
      - run: python scripts/test_simulator_kit.py
      - run: python scripts/check.py
      - run: python -m unittest discover -s scripts -p test_publication.py
      - run: python -m unittest discover -s community/tests
      - run: python -m unittest discover -s website -p 'test_*.py'
      - run: python website/build.py
      - run: pip install ruff==0.14.14
      - run: ruff check scripts website community
      - run: ruff format --check scripts website community
