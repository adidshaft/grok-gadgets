name: Hub checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: hub-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: pip install -r website/requirements.txt ruff==0.14.14
      - run: node --test website/test_simulator.cjs
      - run: python scripts/build-simulator-kit.py --check
      - run: python scripts/test_simulator_kit.py
      - run: python scripts/check.py --quick
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s community/tests
      - run: python -m unittest discover -s website -p 'test_*.py'
      - run: python website/build.py
      - run: python scripts/check-archive-build.py
      - run: python scripts/check-pages-prefix.py
      - run: ruff check scripts website community
      - run: ruff format --check scripts website community
  kit-current:
    # Advisory: flags a gateway main change to kit inputs that the committed kit lacks.
    # The deploy rebuilds the kit from gateway main, so the live download stays current.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grok-gadgets
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-gateway
          ref: main
          path: grok-gadgets-gateway
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Committed kit matches gateway main inputs
        working-directory: grok-gadgets
        run: python scripts/build-simulator-kit.py --check
